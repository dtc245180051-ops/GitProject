<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Website Layout using CSS Grid</title>
    <style>
      /* 1. Thiết lập CSS Grid cho màn hình Desktop (Mặc định) */
      .grid-container {
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: auto auto 1fr auto;
        grid-template-areas:
          "header header"
          "nav nav"
          "sidebar main"
          "footer footer";
        gap: 10px;
        min-height: 100vh;
      }

      /* Gán vị trí từng phần tử vào Grid Area */
      .header {
        grid-area: header;
        background-color: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }

      .nav {
        grid-area: nav;
        background-color: #34495e;
        color: white;
        padding: 10px;
      }

      .nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        gap: 15px;
      }

      .nav a {
        color: white;
        text-decoration: none;
      }

      .sidebar {
        grid-area: sidebar;
        background-color: #ecf0f1;
        padding: 15px;
      }

      .main {
        grid-area: main;
        background-color: #ffffff;
        padding: 20px;
        border: 1px solid #bdc3c7;
      }

      .footer {
        grid-area: footer;
        background-color: #2c3e50;
        color: white;
        text-align: center;
        padding: 15px;
      }

      /* 2. Responsive cho Mobile (Màn hình dưới 768px): Chuyển thành 1 cột xếp dọc */
      @media (max-width: 768px) {
        .grid-container {
          grid-template-columns: 1fr;
          grid-template-areas:
            "header"
            "nav"
            "main"
            "sidebar"
            "footer";
        }

        .nav ul {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <header class="header">
        <h1>Tiêu đề Trang Web</h1>
      </header>

      <nav class="nav">
        <ul>
          <li><a href="#">Trang chủ</a></li>
          <li><a href="#">Giới thiệu</a></li>
          <li><a href="#">Dịch vụ</a></li>
          <li><a href="#">Liên hệ</a></li>
        </ul>
      </nav>

      <aside class="sidebar">
        <h3>Sidebar</h3>
        <p>Nội dung phụ, quảng cáo, tin tức liên quan...</p>
      </aside>

      <main class="main">
        <h2>Nội dung chính</h2>
        <p>
          Đây là khu vực hiển thị các bài viết và thông tin trọng tâm của trang
          web.
        </p>
      </main>

      <footer class="footer">
        <p>&copy; 2026 Bản quyền thuộc về Trang Web Của Tôi</p>
      </footer>
    </div>
  </body>
</html>
