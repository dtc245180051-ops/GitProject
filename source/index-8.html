<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách sản phẩm</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      table {
        width: 100%;
        max-width: 600px;
        border-collapse: collapse;
        margin-top: 15px;
      }

      th,
      td {
        border: 1px solid #dddddd;
        text-align: left;
        padding: 10px;
      }

      th {
        background-color: #f2f2f2;
        font-weight: bold;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h1>Danh sách sản phẩm</h1>

    <table>
      <thead>
        <tr>
          <th>Tên sản phẩm</th>
          <th>Giá</th>
          <th>Số lượng</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Điện thoại iPhone 15</td>
          <td>22.990.000 VNĐ</td>
          <td>15</td>
        </tr>
        <tr>
          <td>Laptop Dell XPS 13</td>
          <td>35.500.000 VNĐ</td>
          <td>8</td>
        </tr>
        <tr>
          <td>Tai nghe Sony WH-1000XM5</td>
          <td>8.490.000 VNĐ</td>
          <td>25</td>
        </tr>
        <tr>
          <td>Đồng hồ Apple Watch Series 9</td>
          <td>10.290.000 VNĐ</td>
          <td>12</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
