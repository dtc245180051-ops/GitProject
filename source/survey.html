<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Research Survey</title>
    <style>
      body {
        background-color: #1a1a1b;
        color: #d7dedd;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 750px;
        padding: 20px;
      }

      h1 {
        font-size: 22px;
        font-weight: normal;
        margin-bottom: 6px;
        color: #ffffff;
      }

      .subtitle {
        font-size: 13px;
        color: #9a9a9a;
        margin-bottom: 20px;
        border-bottom: 1px dashed #444;
        padding-bottom: 15px;
      }

      .form-group {
        margin-bottom: 22px;
      }

      label.question-title {
        display: block;
        font-weight: bold;
        font-size: 13px;
        margin-bottom: 8px;
        color: #e0e0e0;
      }

      select,
      input[type="text"] {
        background-color: #2b2b2c;
        color: #ffffff;
        border: 1px solid #444;
        padding: 6px 10px;
        font-size: 13px;
        border-radius: 2px;
        box-sizing: border-box;
      }

      select {
        width: 100%;
        max-width: 500px;
      }

      .radio-group,
      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .radio-item,
      .checkbox-item {
        display: flex;
        align-items: center;
        font-size: 13px;
      }

      .radio-item input,
      .checkbox-item input {
        margin-right: 8px;
      }

      .other-input {
        margin-top: 5px;
        margin-left: 20px;
        width: 120px;
      }

      .price-inputs {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 13px;
      }

      .price-field {
        display: flex;
        flex-direction: column;
      }

      .price-field input {
        width: 50px;
        text-align: center;
      }

      .price-field span {
        font-size: 11px;
        color: #888;
        margin-top: 4px;
      }

      textarea {
        width: 100%;
        max-width: 500px;
        height: 80px;
        background-color: #2b2b2c;
        color: #ffffff;
        border: 1px solid #444;
        padding: 8px;
        font-family: inherit;
        border-radius: 2px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Market Research Survey</h1>
      <div class="subtitle">
        Please take a few moments to complete this satisfaction survey.
      </div>

      <form action="" method="POST">
        <!-- Question 1 -->
        <div class="form-group">
          <label class="question-title">What is your age range?</label>
          <select name="age_range">
            <option value="18-24">18-24</option>
            <option value="25-34">25-34</option>
            <option value="35-44">35-44</option>
            <option value="45+">45+</option>
          </select>
        </div>

        <!-- Question 2 -->
        <div class="form-group">
          <label class="question-title"
            >What is your yearly income range?</label
          >
          <select name="income_range">
            <option value="0-25000">$0 - $25,000</option>
            <option value="25001-50000">$25,001 - $50,000</option>
            <option value="50001-100000">$50,001 - $100,000</option>
            <option value="100000+">$100,000+</option>
          </select>
        </div>

        <!-- Question 3 -->
        <div class="form-group">
          <label class="question-title">Gender Identity</label>
          <div class="radio-group">
            <label class="radio-item"
              ><input type="radio" name="gender" value="Male" /> Male</label
            >
            <label class="radio-item"
              ><input type="radio" name="gender" value="Female" /> Female</label
            >
            <label class="radio-item"
              ><input type="radio" name="gender" value="Nonbinary" />
              Nonbinary</label
            >
            <label class="radio-item"
              ><input type="radio" name="gender" value="Other" /> Other</label
            >
          </div>
          <input type="text" name="gender_other" class="other-input" />
        </div>

        <!-- Question 4 -->
        <div class="form-group">
          <label class="question-title"
            >Which of the following products have your purchased in the last 2
            months. Please check all that apply.</label
          >
          <div class="checkbox-group">
            <label class="checkbox-item"
              ><input type="checkbox" name="product" value="Product 1" />
              Product 1</label
            >
            <label class="checkbox-item"
              ><input type="checkbox" name="product" value="Product 2" />
              Product 2</label
            >
            <label class="checkbox-item"
              ><input type="checkbox" name="product" value="Product 3" />
              Product 3</label
            >
          </div>
        </div>

        <!-- Question 5 -->
        <div class="form-group">
          <label class="question-title"
            >How often would you use our new product?</label
          >
          <div class="radio-group">
            <label class="radio-item"
              ><input type="radio" name="frequency" value="Daily" />
              Daily</label
            >
            <label class="radio-item"
              ><input type="radio" name="frequency" value="Weekly" />
              Weekly</label
            >
            <label class="radio-item"
              ><input type="radio" name="frequency" value="Monthly" />
              Monthly</label
            >
          </div>
        </div>

        <!-- Question 6 -->
        <div class="form-group">
          <label class="question-title"
            >What would you pay for the new product?</label
          >
          <div class="price-inputs">
            <span>$</span>
            <div class="price-field">
              <input type="text" name="price_dollars" />
              <span>Dollars</span>
            </div>
            <span>.</span>
            <div class="price-field">
              <input type="text" name="price_cents" />
              <span>Cents</span>
            </div>
          </div>
        </div>

        <!-- Question 7 -->
        <div class="form-group">
          <label class="question-title"
            >What features would you like to see in the new product.</label
          >
          <textarea name="features"></textarea>
        </div>
      </form>
    </div>
  </body>
</html>
