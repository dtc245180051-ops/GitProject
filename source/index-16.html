<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực hành CSS Box Model & Box-Sizing</title>
    <link rel="stylesheet" href="style-16.css" />
  </head>
  <body>
    <h1>So sánh Box-Sizing (content-box vs border-box)</h1>

    <div class="card">
      <h3>Thẻ 1 (content-box)</h3>
      <p>Kích thước tổng = width + padding + border.</p>
    </div>

    <div class="card">
      <h3>Thẻ 2 (border-box)</h3>
      <p>Kích thước tổng = width đã bao gồm padding + border.</p>
    </div>

    <div class="card">
      <h3>Thẻ 3 (border-box)</h3>
      <p>Kích thước tổng cố định 280px x 150px.</p>
    </div>
  </body>
</html>
