<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang web của tôi</title>
    <!-- Liên kết với file CSS -->
    <link rel="stylesheet" href="style-14.css" />
  </head>
  <body>
    <!-- Tiêu đề h1 -->
    <h1>Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân -->
    <p class="description">
      Xin chào! Tôi là một người đam mê công nghệ và lập trình. Tôi luôn học hỏi
      mỗi ngày để nâng cao kỹ năng phát triển trang web chuyên nghiệp.
    </p>

    <!-- Danh sách sở thích -->
    <ul class="my-hobbies">
      <li>Lập trình web</li>
      <li>Đọc sách công nghệ</li>
      <li>Đi du lịch trải nghiệm</li>
    </ul>

    <!-- Nút bấm -->
    <div class="button-container">
      <button class="my-btn">Nhấn vào đây</button>
    </div>
  </body>
</html>
