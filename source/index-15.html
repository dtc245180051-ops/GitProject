<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang web của tôi</title>
    <!-- Liên kết đến file CSS bên ngoài -->
    <link rel="stylesheet" href="style-15.css" />
  </head>
  <body>
    <!-- Tiêu đề <h1> -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn <p> mô tả -->
    <p class="description">
      Đây là trang web giới thiệu đơn giản được tạo bằng HTML và CSS nhằm thực
      hành các thuộc tính định dạng màu nền, hình nền và căn chỉnh bố cục.
    </p>

    <!-- Khối <div> chứa nội dung quan trọng -->
    <div class="important-box">
      <h2>Thông Tin Quan Trọng</h2>
      <p>
        Khối này được trang bị ảnh nền riêng biệt và căn giữa toàn bộ nội dung
