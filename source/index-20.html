<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trình đơn Dropdown hàng ngang</title>
    <style>
      /* 1. Đặt phông chữ chung cho trang và phân vùng cho trình đơn */
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 20px;
      }

      #menu {
        height: 40px;
        background-color: #333333;
        border-bottom: 3px solid #cc0000;
      }

      #menu ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* 2. Định nghĩa bộ chọn cho các phần tử trong danh sách (li) nằm ngang */
      #menu > ul > li {
        float: left; /* Xếp các mục menu cha nằm ngang */
        position: relative; /* Làm mốc vị trí cho menu con thả xuống */
      }

      /* 3. Định nghĩa bộ chọn cho các liên kết (a) trong trình đơn */
      #menu a {
        display: block;
        width: 130px;
        height: 40px;
        line-height: 40px; /* Căn giữa chữ theo chiều dọc */
        text-align: center;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
      }

      /* 4. Đổi màu nền liên kết sang màu đỏ khi rê chuột vào (hover) */
      #menu a:hover {
        background-color: #cc0000;
      }

      /* 5 & 6. Định vị trí và ẩn các trình đơn con (#menu ul ul) */
      #menu ul ul {
        position: absolute; /* Đặt vị trí tuyệt đối theo menu cha */
        top: 40px; /* Xuất hiện ngay bên dưới thanh menu chính (cao 40px) */
        left: 0;
        background-color: #333333;
        visibility: hidden; /* Ẩn trình đơn con đi */
        z-index: 100;
      }

      #menu ul ul li {
        float: none; /* Menu con xếp theo chiều dọc */
        border-bottom: 1px solid #444444;
      }

      /* 7. Hiển thị trình đơn con khi con trỏ đưa qua mục chọn cha tương ứng */
      #menu li:hover > ul {
        visibility: visible; /* Hiện menu con */
      }
    </style>
  </head>
  <body>
    <!-- Cấu trúc danh sách liên kết lồng nhau 2 cấp -->
    <div id="menu">
      <ul>
        <li><a href="#">Trang chủ</a></li>
        <li>
          <a href="#">Sản phẩm</a>
          <!-- Menu con cấp 2 -->
          <ul>
            <li><a href="#">Điện thoại</a></li>
            <li><a href="#">Máy tính bảng</a></li>
            <li><a href="#">Laptop</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Dịch vụ</a>
          <!-- Menu con cấp 2 -->
          <ul>
            <li><a href="#">Bảo hành</a></li>
            <li><a href="#">Sửa chữa</a></li>
          </ul>
        </li>
        <li><a href="#">Tin tức</a></li>
        <li><a href="#">Liên hệ</a></li>
      </ul>
    </div>
  </body>
</html>
