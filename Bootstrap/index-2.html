<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Đăng Ký Tài Khoản</title>
    <!-- Nhúng CSS Bootstrap 5.3 từ CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <!-- Khung chứa Form -->
          <div class="card shadow-sm p-4 border-0 rounded-3">
            <h2 class="text-center text-primary mb-2">Đăng Ký Tài Khoản</h2>
            <p class="text-center text-muted mb-4">
              Vui lòng điền đầy đủ thông tin bên dưới để hoàn tất đăng ký.
            </p>

            <form action="#" method="POST">
              <!-- 1. Họ và tên -->
              <div class="mb-3">
                <label for="fullName" class="form-label fw-bold"
                  >Họ và tên</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  placeholder="Nhập họ và tên của bạn"
                  required
                />
              </div>

              <!-- 2. Email -->
              <div class="mb-3">
                <label for="emailInput" class="form-label fw-bold"
                  >Địa chỉ Email</label
                >
                <input
                  type="email"
                  class="form-control"
                  id="emailInput"
                  placeholder="name@example.com"
                  required
                />
                <div class="form-text text-muted">
                  Chúng tôi sẽ không bao giờ chia sẻ email của bạn với bất kỳ ai
                  khác.
                </div>
              </div>

              <!-- 3. Mật khẩu -->
              <div class="mb-3">
                <label for="passwordInput" class="form-label fw-bold"
                  >Mật khẩu</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="passwordInput"
                  placeholder="Nhập mật khẩu"
                  required
                />
              </div>

              <!-- 4. Xác nhận mật khẩu -->
              <div class="mb-3">
                <label for="confirmPasswordInput" class="form-label fw-bold"
                  >Xác nhận mật khẩu</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="confirmPasswordInput"
                  placeholder="Nhập lại mật khẩu"
                  required
                />
              </div>

              <!-- 5. Giới tính (Radio button) -->
              <div class="mb-3">
                <label class="form-label fw-bold d-block">Giới tính</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="genderMale"
                    value="male"
                    checked
                  />
                  <label class="form-check-label" for="genderMale">Nam</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="genderFemale"
                    value="female"
                  />
                  <label class="form-check-label" for="genderFemale">Nữ</label>
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="genderOther"
                    value="other"
                  />
                  <label class="form-check-label" for="genderOther">Khác</label>
                </div>
              </div>

              <!-- 6. Sở thích (Checkbox) -->
              <div class="mb-3">
                <label class="form-label fw-bold d-block">Sở thích</label>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbySports"
                    value="sports"
                  />
                  <label class="form-check-label" for="hobbySports"
                    >Thể thao</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbyMusic"
                    value="music"
                  />
                  <label class="form-check-label" for="hobbyMusic"
                    >Âm nhạc</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="hobbyCoding"
                    value="coding"
                  />
                  <label class="form-check-label" for="hobbyCoding"
                    >Lập trình</label
                  >
                </div>
              </div>

              <!-- 7. Quốc gia (Dropdown Select) -->
              <div class="mb-4">
                <label for="countrySelect" class="form-label fw-bold"
                  >Quốc gia</label
                >
                <select class="form-select" id="countrySelect" required>
                  <option value="" selected disabled>
                    -- Chọn quốc gia --
                  </option>
                  <option value="VN">Việt Nam</option>
                  <option value="US">Mỹ</option>
                  <option value="JP">Nhật Bản</option>
                  <option value="KR">Hàn Quốc</option>
                </select>
              </div>

              <!-- 8. Nút Submit -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  Đăng Ký ngay
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Nhúng JS Bootstrap 5.3 từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
