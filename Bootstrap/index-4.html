<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thực Hành Tổng Hợp Bootstrap 5</title>

    <!-- Nhúng CSS Bootstrap 5.3.3 & Font Awesome 6.5.2 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="bg-light">
    <!-- Header nhỏ với Font Awesome Icon -->
    <div class="container mt-4">
      <h3><i class="fas fa-home"></i> Trang chủ</h3>
    </div>

    <!-- Bước 1: Cấu trúc Grid với 3 cột + Flexbox căn giữa -->
    <div class="container mt-5">
      <div class="row">
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border"
        >
          <p class="m-0">Phần 1</p>
        </div>
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white"
        >
          <p class="m-0">Phần 2</p>
        </div>
        <div
          class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3 border"
        >
          <p class="m-0">Phần 3</p>
        </div>
      </div>
    </div>

    <!-- Bước 2: Áp dụng Margin & Padding (my-5, py-3) -->
    <div class="container my-5 py-3 bg-white shadow-sm rounded">
      <h3 class="text-center">
        Khoảng cách được điều chỉnh bằng Margin & Padding
      </h3>
    </div>

    <!-- Bước 3: Display Property (d-none d-md-block) -->
    <div class="container">
      <div class="d-none d-md-block bg-warning text-center p-3 rounded">
        <p class="m-0 fw-bold">
          Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px
          (Desktop / Tablet)
        </p>
      </div>
    </div>

    <!-- Bước 4: Tạo Carousel slideshow -->
    <div class="container">
      <div
        id="myCarousel"
        class="carousel slide mt-5 shadow"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner rounded">
          <div class="carousel-item active">
            <img
              src="https://picsum.photos/1200/400?random=10"
              class="d-block w-100"
              alt="Hình ảnh 1"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://picsum.photos/1200/400?random=11"
              class="d-block w-100"
              alt="Hình ảnh 2"
            />
          </div>
          <div class="carousel-item">
            <img
              src="https://picsum.photos/1200/400?random=12"
              class="d-block w-100"
              alt="Hình ảnh 3"
            />
          </div>
        </div>

        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>

        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#myCarousel"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
      </div>
    </div>

    <!-- Bước 5 & 6: Tạo Form với Font Awesome Button -->
    <form class="container mt-5 mb-5 p-4 bg-white shadow-sm rounded">
      <h4 class="mb-4">Liên hệ với chúng tôi</h4>

      <div class="mb-3">
        <label for="name" class="form-label">Họ và tên</label>
        <input
          type="text"
          class="form-control"
          id="name"
          placeholder="Nhập họ và tên"
        />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="email"
          placeholder="Nhập email"
        />
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Nội dung</label>
        <textarea
          class="form-control"
          id="message"
          rows="4"
          placeholder="Nhập nội dung"
        ></textarea>
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="fas fa-paper-plane"></i> Gửi
      </button>
    </form>

    <!-- Nhúng JS Bootstrap 5.3.3 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
