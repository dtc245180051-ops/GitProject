<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Căn Giữa Hoàn Hảo Với Flexbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    /* --- 1. Universal Box-Sizing Reset --- */
    html {
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* --- 2. Bộ 3 Dòng CSS Căn Giữa Cốt Lõi --- */
    .container {
      min-height: 100vh; /* Phủ trọn 100% chiều cao màn hình */
      display: flex; /* Kích hoạt Flexbox */
      justify-content: center; /* Căn giữa theo chiều ngang (Main Axis) */
      align-items: center; /* Căn giữa theo chiều dọc (Cross Axis) */
      background-color: #f0f2f5; /* Màu nền xám nhạt */
    }

    /* --- 3. Định Dạng Thẻ Card --- */
    .center-card {
      padding: 30px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }

    .center-card h3 {
      margin-top: 0;
      color: #1a252f;
    }

    .center-card p {
      margin-bottom: 0;
      color: #555555;
    }
  </style>
  <body>
    <!-- Khung chứa bao bọc toàn màn hình -->
    <div class="container">
      <!-- Thẻ thông báo được căn giữa -->
      <div class="center-card">
        <h3>Căn giữa hoàn hảo!</h3>
        <p>Phần tử này nằm chính giữa khung nhìn màn hình.</p>
      </div>
    </div>
  </body>
</html>
