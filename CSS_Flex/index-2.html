<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Website Layout using Flexbox</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
      }

      /* Khung chứa chính dùng Flexbox xếp dọc */
      .page-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* 1. Header */
      .header {
        background-color: #2c3e50;
        color: white;
        padding: 20px;
        text-align: center;
      }

      /* 2. Navigation */
      .nav {
        background-color: #34495e;
        padding: 10px;
      }

      .nav ul {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        gap: 15px;
      }

      .nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
      }

      /* 3. Khung chứa Sidebar & Main Content (Xếp ngang trên Desktop) */
      .main-container {
        display: flex;
        flex-direction: row;
        flex-grow: 1;
        padding: 10px;
        gap: 10px;
      }

      .sidebar {
        flex-basis: 200px;
        flex-grow: 0;
        flex-shrink: 0;
        background-color: #ecf0f1;
        padding: 15px;
        border-radius: 4px;
      }

      .main-content {
        flex-grow: 1;
        background-color: #ffffff;
        padding: 20px;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
      }

      /* 4. Footer */
      .footer {
        background-color: #2c3e50;
        color: white;
        text-align: center;
        padding: 15px;
      }

      /* -------------------------------------------
         * Responsive cho Mobile (Màn hình < 768px)
         * ------------------------------------------- */
      @media (max-width: 768px) {
        .nav ul {
          flex-direction: column;
        }

        .main-container {
          flex-direction: column;
        }

        .sidebar {
          flex-basis: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <!-- Header -->
      <header class="header">
        <h1>Tiêu đề Trang Web</h1>
      </header>

      <!-- Navigation -->
      <nav class="nav">
        <ul>
          <li><a href="#">Trang chủ</a></li>
          <li><a href="#">Giới thiệu</a></li>
          <li><a href="#">Dịch vụ</a></li>
          <li><a href="#">Liên hệ</a></li>
        </ul>
      </nav>

      <!-- Main Container (Sidebar + Main Content) -->
      <div class="main-container">
        <aside class="sidebar">
          <h3>Sidebar</h3>
          <p>Nội dung phụ, tin tức, quảng cáo...</p>
        </aside>

        <main class="main-content">
          <h2>Nội dung chính</h2>
          <p>Khu vực hiển thị bài viết và thông tin trọng tâm của trang web.</p>
        </main>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>&copy; 2026 Bản quyền thuộc về Trang Web Của Tôi</p>
      </footer>
    </div>
  </body>
</html>
